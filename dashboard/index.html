<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Интерфейс управления источниками и диагностикой MCP-сервера mcp-1c"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310182b'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='34' fill='white'%3E1C%3C/text%3E%3C/svg%3E"
    />
    <title>mcp-1c · центр конфигураций</title>
    <script>
      try {
        const savedUi = JSON.parse(localStorage.getItem("mcp1c-dashboard-ui") || "null");
        document.documentElement.dataset.theme = savedUi?.state?.theme === "dark" ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
