services:
  mcp1c:
    # Этот override используется только вместе с docker-compose.yml. Базовый
    # файл оставляет backend на 127.0.0.1:5001; наружу его публикует TLS reverse
    # proxy на той же машине, который обязан переписывать X-Forwarded-*.
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN обязателен для удалённого профиля}
      API_TOKEN: ${API_TOKEN:?API_TOKEN обязателен для удалённого профиля}
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --data
      - /data
      - --require-writable-data
      - --trust-proxy-headers
