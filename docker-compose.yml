services:
  mcp1c:
    build:
      context: .
      target: runtime-core
    image: mcp1c:latest
    container_name: mcp1c
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # Безопасный профиль по умолчанию: порт доступен только с этой машины.
      # Для удалённого HTTPS-доступа см. docker-compose.remote.yml и README.
      - "127.0.0.1:${MCP1C_PORT:-5001}:8000"
    volumes:
      # `./data/bootstrap` индексируется при старте: выгрузки метаданных
      # (*.zip) и справка платформы (*.hbk).
      # `./data/incoming` разбирается по кнопке: выгрузки конфигурации в файлы,
      # гигабайты — разбирать такое при каждом старте нельзя.
      - type: bind
        source: ${MCP1C_DATA_DIR:-./data}
        target: /data
        bind:
          # Отсутствующий путь — ошибка развёртывания, а не новый root-owned
          # каталог, в который процесс uid=10001 не сможет писать.
          create_host_path: false
          # На SELinux-хосте каталог получает приватную метку контейнера.
          # Docker без SELinux это поле игнорирует.
          selinux: Z
    environment:
      # Запись: загрузка и удаление источников, правка словаря,
      # POST /admin/reload. Без токена этих ручек не существует.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Чтение: инструменты MCP и страницы дашборда. Пока не задан, структура
      # конфигураций открыта всем, кто дотянется до адреса. Оба берутся из
      # `.env` рядом с этим файлом — шаблон в `.env.example`.
      API_TOKEN: ${API_TOKEN:-}
      # Необязательная каноническая SQLite. Пустое значение использует
      # управляемый путь /data/reference/reference.sqlite3; `off` отключает.
      MCP1C_REFERENCE_DB: ${MCP1C_REFERENCE_DB:-}
      # Только для локальной приёмки экспериментальной ветки. Релиз не должен
      # запускаться с обходом проверки подписи.
      MCP1C_REFERENCE_TRUST_UNSIGNED: ${MCP1C_REFERENCE_TRUST_UNSIGNED:-}
      # Базовый файл — только MCP. UI включается одним из двух явных override.
      MCP1C_DASHBOARD: off
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
