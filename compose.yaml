services:
  mcp1c:
    # Release-файл получает готовый образ. Для локальной проверки разработчик
    # сначала собирает тот же target и подменяет только MCP1C_IMAGE.
    image: ${MCP1C_IMAGE:-ghcr.io/azeevan/mcp-1c:4.5.0}
    pull_policy: missing
    container_name: mcp1c
    restart: unless-stopped
    init: true
    # Пик cgroup при полной загрузке Розницы с расширением ×2,5 (2026-10-23).
    mem_limit: 7564124160
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # По умолчанию backend доступен только хосту. Прямой HTTP публикуется
      # явным MCP1C_BIND_ADDRESS=0.0.0.0 либо адресом нужного интерфейса.
      - target: 8000
        published: "${MCP1C_PORT:-5001}"
        host_ip: "${MCP1C_BIND_ADDRESS:-127.0.0.1}"
        protocol: tcp
    volumes:
      - type: bind
        source: ${MCP1C_DATA_DIR:-./data}
        target: /data
        bind:
          create_host_path: false
          selinux: Z
      # Необязательные корни выгрузок, по одному mount на конфигурацию:
      # - type: bind
      #   source: /absolute/path/to/export
      #   target: /config-sources/config-a
      #   read_only: true
      #   bind:
      #     create_host_path: false
    environment:
      # Официальный образ не стартует без двух разных безопасных токенов.
      API_TOKEN: ${API_TOKEN:?Укажите API_TOKEN в .env}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Укажите ADMIN_TOKEN в .env}
      # Современный дашборд включён по умолчанию; `off` оставляет только MCP.
      MCP1C_DASHBOARD: ${MCP1C_DASHBOARD:-on}
      # Только `https-proxy` доверяет X-Forwarded-* от внешнего TLS proxy.
      MCP1C_ACCESS: ${MCP1C_ACCESS:-local}
      # Внешний адрес публикации отличается от bind 0.0.0.0 внутри контейнера.
      MCP1C_PUBLISHED_ADDRESS: ${MCP1C_BIND_ADDRESS:-127.0.0.1}
      # IP или CIDR proxy через запятую. Пусто в `https-proxy` — доверять
      # любому источнику: тогда порт backend обязан быть доступен только proxy.
      MCP1C_TRUSTED_PROXIES: ${MCP1C_TRUSTED_PROXIES:-}
      # Дополнительные имена сервера через запятую (`host` или `host:port`).
      # В local Host/Origin проверяются всегда; в http/https-proxy список
      # включает проверку вместе с настройками публикации и публичного URL.
      MCP1C_ALLOWED_HOSTS: ${MCP1C_ALLOWED_HOSTS:-}
      # Публичный origin для выдачи ссылки на gzip-файл полного модуля.
      MCP1C_PUBLIC_BASE_URL: ${MCP1C_PUBLIC_BASE_URL:-}
      MCP1C_ALLOW_SELF_RESTART: ${MCP1C_ALLOW_SELF_RESTART:-1}
      # Пусто — дефолт 16 ГиБ распакованного на полную выгрузку (ZIP и каталог).
      MCP1C_INTAKE_MAX_UNPACKED: ${MCP1C_INTAKE_MAX_UNPACKED:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
