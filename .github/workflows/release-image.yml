# Публикация не запускается от push или вручную: только после публикации
# стабильного GitHub Release. До этого шага registry не изменяется.
name: release-image

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-image-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/azeevan/mcp-1c

jobs:
  publish:
    name: multi-arch image, SBOM и provenance
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Получить точный release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Сверить стабильный tag, версии и SHA
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="$(python tools/check_image_release.py "${RELEASE_TAG}")"
          release_sha="$(git rev-list -n 1 "${RELEASE_TAG}")"
          checkout_sha="$(git rev-parse HEAD)"
          if [[ "${release_sha}" != "${GITHUB_SHA}" || "${checkout_sha}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Checkout, release tag и GITHUB_SHA указывают на разные коммиты."
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Release SHA не входит в историю main."
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Войти в GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Включить arm64 emulation
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Подготовить Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Подготовить SemVer tags и OCI metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=mcp-1c
            org.opencontainers.image.description=MCP-сервер структуры конфигураций 1С
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Собрать и опубликовать один OCI index
        id: push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,mode=max,scope=release-image

  verify-public:
    name: анонимный pull опубликованного digest
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Скачать без registry credentials
        env:
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: docker pull "${IMAGE_NAME}@${IMAGE_DIGEST}"
