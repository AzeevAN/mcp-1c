# Тесты не зависят от содержимого `data/`: проприетарных выгрузок и справки
# в репозитории нет, всё нужное собирается синтетически в tests/conftest.py.
# Поэтому прогон идёт на голом runner'е, без секретов и без внешних данных.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev-lock.txt

      - name: Установить зависимости
        run: python -m pip install --require-hashes -r requirements-dev-lock.txt

      - name: Прогнать тесты
        run: python -m pytest

  exporter:
    # Правило проекта: `exporter-1c/dist/` — результат сборки, руками не
    # правится, и пересобирается тем же коммитом, что и `src/`. Проверяем
    # ровно это: пересобрали — файлы не изменились. Заодно сборщик сам
    # проверяет, что XML-варианты компилируются на 8.3.5.
    name: сборка обработки выгрузки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Пересобрать модули
        run: python exporter-1c/build_modules.py

      - name: dist разошёлся с src?
        run: |
          if ! git diff --exit-code -- exporter-1c/dist; then
            echo "::error::exporter-1c/dist не пересобран. Запустите: python exporter-1c/build_modules.py"
            exit 1
          fi

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
          package-manager-cache: false

      - name: Проверить frontend и пакетную копию assets
        working-directory: dashboard
        run: |
          npm ci
          npm test -- --run
          npm run typecheck
          npm run build
          cd ..
          python tools/sync_dashboard_assets.py --check

  package:
    name: сборка пакета
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Собрать колесо и проверить метаданные
        run: |
          python -m pip install --require-hashes -r requirements-build-lock.txt
          python -m build --no-isolation
          python -m twine check dist/*
          python tools/check_dashboard_artifacts.py \
            --source src/mcp1c/dashboard_dist \
            --wheel dist/*.whl \
            --sdist dist/*.tar.gz
          mkdir -p "${RUNNER_TEMP}/wheel-from-sdist"
          python -m pip wheel --no-build-isolation --no-deps \
            dist/*.tar.gz --wheel-dir "${RUNNER_TEMP}/wheel-from-sdist"
          python tools/check_dashboard_artifacts.py \
            --source src/mcp1c/dashboard_dist \
            --wheel "${RUNNER_TEMP}"/wheel-from-sdist/*.whl
